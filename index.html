<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Canva</title>
  <style>
    :root {
      --bg: #0e1116;
      --card: #161b22;
      --accent: #00c4cc;
      --accent2: #7d2ae8;
      --text: #e6edf3;
      --muted: #9aa7b4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1a2230 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid #232c38;
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(0,196,204,0.35);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 52px;
      line-height: 1.05;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }
    p.lead {
      font-size: 19px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .cta {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 30px;
      border-radius: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(125,42,232,0.4); }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Coming Soon</span>
    <h1>Auto Canva</h1>
    <p class="lead">Automating beautiful design, the easy way. This page is the home base for the project — more is on the way.</p>
    <a class="cta" href="#">Stay Tuned</a>
    <footer>Built by Doc Rock &middot; Powered by GitHub Pages</footer>
  </main>
</body>
</html>
